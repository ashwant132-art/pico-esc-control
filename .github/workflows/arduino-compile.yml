    - name: Install Platform Core
      run: |
        arduino-cli core update-index
        # Add the community index URL for the Earle Philhower RP2040 core
        arduino-cli config add board_manager.additional_urls https://github.com
        arduino-cli core update-index
        # Install the actual core
        arduino-cli core install rp2040:rp2040

    - name: Compile C++ Sketch
      uses: arduino/compile-sketches@v1
      with:
        fqbn: "rp2040:rp2040:rpico" # This targets the standard Raspberry Pi Pico
        sketch-paths: "./firmware"
