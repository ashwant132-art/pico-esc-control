name: Build firmware (.uf2)

# Compiles firmware/pico_esc_throttle for the Raspberry Pi Pico and publishes the
# resulting .uf2 as a downloadable artifact - no local Arduino IDE setup needed.
# Runs on every push/PR that touches the firmware, and can be triggered manually
# from the Actions tab (Run workflow).

on:
  push:
    paths:
      - "firmware/**"
      - ".github/workflows/build-uf2.yml"
  pull_request:
    paths:
      - "firmware/**"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
      permissions:
      contents: write
      
    steps:
      - uses: actions/checkout@v4

      - name: Install arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: Install the Raspberry Pi Pico (rp2040) core
        run: |
          arduino-cli config init --additional-urls https://github.com/earlephilhower/arduino-pico/releases/download/global/package_rp2040_index.json
          arduino-cli core update-index
          arduino-cli core install rp2040:rp2040

      - name: Compile
        run: |
          arduino-cli compile \
            --fqbn rp2040:rp2040:rpipico \
            --output-dir build \
            firmware/pico_esc_throttle

      - name: Find the .uf2
        id: find
        run: |
          UF2=$(find build -name '*.uf2' | head -n1)
          echo "Found: $UF2"
          cp "$UF2" pico_esc_throttle.uf2

      - name: Upload .uf2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: pico_esc_throttle-uf2
          path: pico_esc_throttle.uf2
          if-no-files-found: error

      - name: Attach to release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: pico_esc_throttle.uf2
